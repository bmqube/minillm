name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The `#[ignore]`d integration tests need GPT-2 / Qwen3 weights on disk.
      # Everything else — samplers, KV-cache container and quantization
      # round-trips, RoPE against a scalar reference, GQA head mapping, config
      # parsing for both architectures, doctests — runs without downloading
      # anything.
      - name: Test
        run: cargo test --all-targets

      - name: Doctests
        run: cargo test --doc

      - name: Docs
        run: cargo doc --no-deps
