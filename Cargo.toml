[package]
name = "minillm"
version = "0.3.0"
edition = "2021"
# hf-hub's xet transfer stack needs 1.91 (xet-core-structures uses
# `str::floor_char_boundary`); CI checks this version.
rust-version = "1.91"
# `cargo run` with no `--bin` runs the CLI demo, as the README shows.
default-run = "minillm"
authors = ["BM Monjur Morshed"]
description = "A small transformer inference engine (GPT-2, Qwen3, Qwen3.5) in Rust, built on candle"
license = "MIT"
repository = "https://github.com/bmqube/minillm"
homepage = "https://github.com/bmqube/minillm"
documentation = "https://docs.rs/minillm"
readme = "README.md"
keywords = ["llm", "transformer", "inference", "gpt", "candle"]
categories = ["algorithms"]
exclude = ["target/", ".git/", ".gitignore"]

[lib]
name = "minillm"
path = "src/lib.rs"

[[bin]]
name = "minillm"
path = "src/main.rs"

[[example]]
name = "generate"
path = "examples/generate.rs"

[features]
# CPU-only by default so the crate builds on machines without CUDA.
# Enable GPU with:  cargo build --release --features cuda
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
hf-hub = { version = "1.0.0", features = ["blocking"] }
tokenizers = { version = "0.23.1", features = ["http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
dotenvy = "0.15.7"         # maintained fork of the unmaintained `dotenv`
num_cpus = "1.17.0"        # physical-core count for the thread plan

# Integration tests are their own crate, so they need these in scope directly
# even though the library already depends on them.
[dev-dependencies]
candle-core = "0.11.0"
tokenizers = { version = "0.23.1", features = ["http"] }
