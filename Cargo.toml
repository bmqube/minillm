[package]
name = "minillm"
version = "0.2.0"
edition = "2021"
authors = ["BM Monjur Morshed"]
description = "A small GPT-2 inference engine in Rust, built on candle"
license = "MIT"
repository = "https://github.com/bmqube/minillm"
homepage = "https://github.com/bmqube/minillm"
documentation = "https://docs.rs/minillm"
readme = "README.md"
keywords = ["llm", "transformer", "inference", "gpt", "candle"]
categories = ["algorithms"]
exclude = ["target/", ".git/", ".gitignore"]

[lib]
name = "minillm"
path = "src/lib.rs"

[[bin]]
name = "minillm"
path = "src/main.rs"

[[example]]
name = "generate"
path = "examples/generate.rs"

[features]
# CPU-only by default so the crate builds on machines without CUDA.
# Enable GPU with:  cargo build --release --features cuda
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.9.1" }
hf-hub = "0.4.3"
tokenizers = { version = "0.22.1", features = ["http"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
rand = "0.8"
dotenv = "0.15.0"
